name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install Nix with the org's substituter pre-configured as trusted.
      # The flake.nix's nixConfig.extra-substituters is otherwise ignored
      # as "untrusted flake configuration" — only nix.conf entries from a
      # trusted source (here: the installer's extra-conf, which writes
      # /etc/nix/nix.conf as root) are honored.
      #
      # We deliberately do NOT use DeterminateSystems/magic-nix-cache-action.
      # It depends on FlakeHub authentication, which the org doesn't run, so
      # every PR was failing with "Unable to authenticate to FlakeHub" and
      # cascading "substituter disabled" errors. The org's own cache replaces
      # that role.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.stevedores.org/
            extra-trusted-substituters = https://nix-cache.stevedores.org/
            extra-trusted-public-keys = stevedores-1:ZEtb+wHYNR/LDmMDhF3/EpRZDNma8exY2b1TGZ6uS2A=

      # One dev shell, one cargo build graph. Separate `nix build .#checks.*`
      # derivations each rebuild release artifacts and exceed CI time limits.
      # Full flake gates (doc/benches/workspace) stay on `just flake-check`.
      - name: Format, clippy, and tests
        run: |
          nix develop --command bash -ec '
            set -o pipefail
            cargo fmt --all -- --check
            cargo clippy --workspace --all-targets -- -D warnings
            cargo nextest run --workspace --cargo-profile release
          '

  feature-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.stevedores.org/
            extra-trusted-substituters = https://nix-cache.stevedores.org/
            extra-trusted-public-keys = stevedores-1:ZEtb+wHYNR/LDmMDhF3/EpRZDNma8exY2b1TGZ6uS2A=

      - name: Feature-gated integration tests
        run: |
          nix develop --command bash -ec '
            set -o pipefail
            cargo test -p graphrag-core --features "incremental,async" --test incremental_correctness_test --verbose
            cargo test -p graphrag-core --features "incremental,async" --test incremental_perf_test --verbose -- --nocapture
            cargo test -p graphrag-core --features "surrealdb-storage" surrealdb
          '
